<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>LEVEL 10 · 田块与路网检查</title><style>body{margin:0;background:#141c19;color:#dedac9;font:15px sans-serif}main{max-width:1150px;margin:18px auto}h1{font-size:23px}button{background:#36473a;color:#eee5cc;border:1px solid #6a7964;padding:8px 18px;margin-right:8px;cursor:pointer}canvas{display:block;width:min(85vw,84vh);margin:12px auto;height:auto}p{margin:9px 0;color:#aab5a6}</style><main><h1>LEVEL 10 · 单栋建筑、松散农庄与麦田</h1><button data-x="-8" data-z="-6">出生区与开普哈特</button><button data-x="7" data-z="-17">田间单栋与湖泊</button><button data-x="12" data-z="-5">田间建筑与农田</button><p id="status">加载…</p><canvas width="1024" height="1024"></canvas><p>金黄：小麦 · 褐色：大麦/麦茬 · 绿边：草地/双辙路 · 青色：水面</p><p>游戏地图生成器实时输出，1024 × 1024 米；此检查图不是第一人称 3D 截图。</p></main><script type="module">
import {createMapTiles} from '/map-tiles.js?v=37';import {stringSeed} from '/world.js?v=37';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let epoch=0;
async function render(x0,z0){const run=++epoch,tiles=createMapTiles({seed:stringSeed('CHLORINE / ABUNDANCE / 10'),maxTiles:280,tilePixels:64});ctx.fillStyle='#223027';ctx.fillRect(0,0,1024,1024);for(let z=0;z<16;z++)for(let x=0;x<16;x++)tiles.request(BigInt(x+x0),BigInt(z+z0));
 function frame(){if(run!==epoch){tiles.dispose();return;}tiles.pump(20,3);for(let z=0;z<16;z++)for(let x=0;x<16;x++){const t=tiles.get(BigInt(x+x0),BigInt(z+z0));if(t)ctx.drawImage(t,x*64,z*64,64,64);}const s=tiles.stats();status.textContent=s.pending?'正在生成 '+s.completed+' / 256':'检查地图完成 · 256 个区块 · 固定种子';if(s.pending)requestAnimationFrame(frame);}frame();}
for(const b of document.querySelectorAll('button'))b.onclick=()=>render(+b.dataset.x,+b.dataset.z);render(-8,-6);
</script></html>
