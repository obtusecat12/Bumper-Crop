<!doctype html><meta charset="utf-8"><body style="margin:0;background:#111"><script type="module">
import * as T from '/vendor/three.module.min.js';import{createLevel0World}from'/level0-world.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1100,760);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.91;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(67,1100/760,.06,180);camera.rotation.order='YXZ';const world=createLevel0World(T,renderer);await world.ready;
const poses={classic:[[3,1.67,10],[8,1.63,-5]],arches:[[35.5,1.67,23],[40.6,1.60,9]],columns:[[2,1.67,83],[0,1.63,151]],pits:[[-41,1.67,9],[-48,.7,4]],blackout:[[8,1.67,-43],[8,1.65,-52]],red:[[98,1.67,37],[103,1.6,25]],furniture:[[76,1.67,13],[76,1.1,8]],sofa:[[77.4,.96,9.5],[76,.61,8]],buckets:[[33.8,1.5,19.7],[32.2,.33,17.3]],breaker:[[15.7,1.64,5.6],[16.91,1.5,5]],chaos:[[20,1.67,10],[17.1,1.2,8.6]]};
function pose(name){let p=poses[name];if(name==='ceiling'||name==='cavity'){let d;for(let z=-1;z<=1&&!d;z++)for(let x=-1;x<=1&&!d;x++)d=world.getChunk(x,z).details.find(d=>name==='cavity'?d.kind===4:d.kind<4);p=[[d.x+1.0,1.65,d.z+1.6],[d.x,2.75,d.z]];}if(name==='panels'||name==='mold'){let d;for(let z=-6;z<=6&&!d;z++)for(let x=-6;x<=6&&!d;x++)d=world.getChunk(x,z)[name==='panels'?'panels':'mold'][0];const r=d.rotation||0,nx=Math.sin(r),nz=Math.cos(r);p=[[d.x+nx*2.3,1.35,d.z+nz*2.3],[d.x,.8,d.z]];}camera.position.set(...p[0]);camera.lookAt(...p[1]);world.update(0,camera.position.x,camera.position.z,camera.rotation.y);renderer.render(world.scene,camera);return{...world.stats(),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,programs:renderer.info.programs.length};}
