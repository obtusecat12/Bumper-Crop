<!doctype html><html><head><meta charset="utf-8"><title>Milling return — actual geometry</title><style>body{margin:0;background:#a7b1ad}canvas{display:block}</style></head><body><script type="module">
import * as T from '/vendor/three.module.min.js';import{initializeMillingTextures}from'/milling-return-materials.js';import{createMillingReturn}from'/milling-return-scene.js';import{returnPoint,returnFloor}from'/milling-return-layout.js';
import{createAtmosphere}from'/atmosphere.js?v=60';import{initializeRuralTextures}from'/rural-textures.js?v=60';await Promise.all([initializeMillingTextures(),initializeRuralTextures()]);const room=createMillingReturn(),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1100,760);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.10;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(62,1100/760,.045,220);const atmosphere=createAtmosphere({scene:room.scene,renderer,quality:"low"});room.scene.add(atmosphere.sky);let t=8;function view(s,back=false,side=0){const p=returnPoint(s),q=returnPoint(s+(back?-13:16));room.update(t,p.x,p.z);camera.position.set(p.x+p.nx*side,returnFloor(p.x,p.z)+1.77,p.z+p.nz*side);camera.lookAt(q.x,returnFloor(q.x,q.z)+1.50,q.z);camera.updateMatrixWorld(true);renderer.shadowMap.needsUpdate=true;atmosphere.update({time:t,camera});atmosphere.sky.userData.renderClouds(camera,1100,760);renderer.render(room.scene,camera);}window.qa={room,renderer,camera,view,ready:true};view(8);
