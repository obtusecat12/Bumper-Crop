<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V33 作物材质核对</title><style>body{background:#242b23;color:#d6cfb6;font:16px Georgia;margin:25px}h1{font-size:24px;font-weight:400}section{display:inline-block;width:31%;vertical-align:top;margin-right:1%}canvas{width:100%;height:auto;background:#464b3e}p{font:14px sans-serif}small{color:#a8ae9f}</style><h1>V33 · 小麦、大麦与收割麦茬</h1><p id="status">生成游戏实际作物图集…</p><main></main><small>实际游戏共享材质图集 · 纹理核对，非 3D 游玩截图</small><script type="module">
import{buildDenseWheat}from'/dense-wheat.js?v=33';import{field,cropSample,stringSeed}from'/world.js?v=33';import{Vector3}from'/vendor/three.module.min.js';
const seed=stringSeed('CHLORINE / ABUNDANCE / 10'),chosen=[],wind={time:{value:0},strength:{value:0},player:{value:new Vector3()}};
for(let z=8;z<20&&chosen.filter(Boolean).length<3;z++)for(let x=8;x<20;x++){const f=field(BigInt(x),BigInt(z),seed,false),p=cropSample(32,32,f,{});if(f.type==='wheat'&&p.distance>48&&!f.meadow&&!chosen[p.crop])chosen[p.crop]=f;}
for(let k=0;k<3;k++){const group=buildDenseWheat(chosen[k],1,'low',wind).mesh,mesh=group.children.find(n=>n.isInstancedMesh),image=mesh.material.map.image,section=document.createElement('section');section.innerHTML='<h2>'+['金黄成熟小麦','枯褐长芒大麦','截秆与倒伏碎秸'][k]+'</h2>';const c=document.createElement('canvas');c.width=512;c.height=image.height;c.getContext('2d').drawImage(image,0,0,512,image.height,0,0,512,image.height);section.append(c);const p=document.createElement('p');p.textContent='实例数 '+mesh.count+' · 每簇 '+(mesh.geometry.index?.count||mesh.geometry.attributes.position.count)/3+' 三角形';section.append(p);document.querySelector('main').append(section)}document.querySelector('#status').textContent='三类作物材质已完成 · 近景另加载立体麦穗/截秆';
</script></html>
