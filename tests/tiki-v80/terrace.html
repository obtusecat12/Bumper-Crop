<!doctype html><meta charset="utf-8"><title>V80 actual facade material inspection</title><style>body{margin:0;background:#979c9a}canvas{display:block}</style><script type="module">
import * as T from '/vendor/three.module.min.js';import{initializeTikiTextures}from'/tiki-materials-v76.js';import{createTikiFacade}from'/tiki-facade-v80.js';import{TIKI_FACADE as F,tikiPoint}from'/tiki-plan-v76.js';import{attachTikiPaving80}from'/tiki-paving-v80.js';
const errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));await initializeTikiTextures();const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1280,900);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color(0x9da6a5);scene.add(new T.HemisphereLight(0xdce6df,0x575545,2.1));const sun=new T.DirectionalLight(0xffe2c1,2);sun.position.set(F.origin.x-8,18,F.origin.z+14);scene.add(sun);const facade=createTikiFacade();scene.add(facade.object);const mat=new T.MeshStandardMaterial({color:0x9f9c92,roughness:.88});attachTikiPaving80(mat);const floor=new T.Mesh(new T.BoxGeometry(31,.2,9),mat);floor.position.set(...(()=>{const p=tikiPoint(0,3.4);return[p.x,F.y-.1,p.z]})());floor.rotation.y=F.angle;scene.add(floor);const camera=new T.PerspectiveCamera(58,1280/900,.04,60);const pos=(x,y,z)=>{const p=tikiPoint(x,z);return[p.x,F.y+y,p.z]};const view=(kind='lounge')=>{const p=kind==='wide'?[-2,2.5,13]:[-3.2,1.65,4.6],target=kind==='wide'?[0,2,.4]:[-1.75,1.35,.80];camera.position.fromArray(pos(...p));camera.lookAt(...pos(...target));camera.updateMatrixWorld();r.render(scene,camera);};window.qa={ready:false,view,renderer:r,scene,errors,facade};await new Promise(resolve=>{const timer=setInterval(()=>{let ready=true;scene.traverse(o=>{for(const m of Array.isArray(o.material)?o.material:[o.material])if(m)for(const v of Object.values(m))if(v?.isTexture&&!v.image?.width)ready=false;});if(ready){clearInterval(timer);resolve();}},50)});view();window.qa.ready=true;
</script>
