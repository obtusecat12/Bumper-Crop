<!doctype html><meta charset="utf-8"><title>Alpha · 无线电室开发预览</title><style>body{margin:0;background:#d7d3bd;color:#292f29;font:15px system-ui}header,footer{padding:20px 32px;background:#26372f;color:#e6e4d0}header{display:flex;justify-content:space-between}h1{font:25px Georgia;margin:0}canvas{display:block;width:100%;height:650px}button{background:#dacb9f;border:0;padding:10px 16px;margin-left:10px}footer{line-height:1.8}</style><header><h1>M.E.G. ALPHA / 探险署无线电室</h1><div><button id="front">设备正面</button><button id="rear">开放机架背面</button></div></header><canvas></canvas><footer>阶段 3 · 开发模型检查点，尚未接入游戏<br>依据官方图片建模；软件投影预览，不代表最终灯光或烘焙。机柜漆面已生成，其他表面仍待独立材质。</footer><script type="module">
import * as T from '/vendor/three.module.min.js';import{appendBox150}from'/alpha150-world.js';import{createRadioModel150,RADIO_FINISHES}from'/__alpha-radio-model.js';
const group=createRadioModel150(T,appendBox150),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let rear=false;const tex=new Image();tex.src='/assets/alpha150/rack-enamel.webp';tex.onload=draw;
function draw(){const W=canvas.width=canvas.clientWidth,H=canvas.height=canvas.clientHeight;ctx.fillStyle='#d7d3bd';ctx.fillRect(0,0,W,H);const cam=new T.PerspectiveCamera(46,W/H,.1,50);cam.position.set(...(rear?[5.1,3.5,-5.5]:[6.2,3.2,7.5]));cam.lookAt(2.9,1.05,.8);cam.updateMatrixWorld();group.updateMatrixWorld(true);const vp=new T.Matrix4().multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse),faces=[];
const project=p=>{const v=p.clone().applyMatrix4(vp);return[(v.x+1)*W/2,(1-v.y)*H/2,v.z];};
for(const m of group.children){const g=m.geometry,ps=g.attributes.position,ns=g.attributes.normal,ix=g.index,nn=ix?ix.count:ps.count;for(let i=0;i<nn;i+=3){const ids=[0,1,2].map(k=>ix?ix.getX(i+k):i+k),pts=ids.map(j=>new T.Vector3().fromBufferAttribute(ps,j).applyMatrix4(m.matrixWorld)),n=new T.Vector3().fromBufferAttribute(ns,ids[0]).transformDirection(m.matrixWorld);if(n.dot(cam.position.clone().sub(pts[0]))<=0)continue;const v=pts.map(project);if(v.some(a=>a[2]>1))continue;const c=new T.Color(RADIO_FINISHES[m.userData.finish]);const shade=.6+.4*Math.max(0,n.dot(new T.Vector3(-.25,.85,.6).normalize()));c.multiplyScalar(shade);faces.push({v,z:v.reduce((s,p)=>s+p[2],0)/3,c:'#'+c.getHexString(),tex:m.userData.finish==='enamel'});}}
faces.sort((a,b)=>b.z-a.z);for(const f of faces){ctx.beginPath();f.v.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=f.c;ctx.fill();if(f.tex&&tex.complete&&tex.naturalWidth){ctx.save();ctx.clip();ctx.globalAlpha=.14;ctx.fillStyle=ctx.createPattern(tex,'repeat');ctx.fill();ctx.restore();}}
ctx.fillStyle='#425349';ctx.font='13px monospace';ctx.fillText('EX-01 / '+(rear?'REAR SERVICE ACCESS':'RECEIVING EQUIPMENT')+' / METRE-SCALE MODEL',30,H-24);document.documentElement.dataset.previewReady='true';}
document.querySelector('#front').onclick=()=>{rear=false;draw()};document.querySelector('#rear').onclick=()=>{rear=true;draw()};window.onresize=draw;draw();
</script>
