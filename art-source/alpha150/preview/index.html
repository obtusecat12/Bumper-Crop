<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>M.E.G. Alpha · 开发预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#1b2421;color:#e8e4d3;font:14px system-ui,sans-serif}header{height:100px;border-bottom:1px solid #4b5c52;padding:22px 36px;display:flex;justify-content:space-between;align-items:center}h1{font:28px Georgia,serif;margin:2px 0}small{color:#aabaae;letter-spacing:2px}button{border:1px solid #667c6d;color:#e9e5ce;background:#293c31;padding:11px 20px;margin-left:8px;cursor:pointer}button.active{background:#e0d5ae;color:#253d30}main{position:relative;height:calc(100vh - 172px);min-height:550px}canvas{display:block;width:100%;height:100%}.key{position:absolute;top:24px;left:30px;width:200px;background:#1b2421df;padding:16px;border-left:3px solid #b6bc8e;line-height:1.8}.key b{font-size:17px}.key span{display:block;color:#b1bfb3}footer{height:72px;padding:16px 36px;background:#25322b;border-top:1px solid #4b5c52;display:flex;justify-content:space-between;line-height:1.7;color:#bac6b8}#note{max-width:620px}
</style><header><div><small>CONSTRUCTION VIEW / 02</small><h1>M.E.G. ALPHA</h1></div><nav><button class="active" id="overview">基地剖切总览</button><button id="west">西侧入口通道</button></nav></header><main><canvas aria-label="Alpha 基地开发模型预览"></canvas><div class="key"><b id="view-title">300 × 260 m</b><span>四署 · 五个居民片区</span><span>69 个房间骨架</span><span>24 m 最大区块边长</span><span id="detail">顶板隐藏以展示布局</span></div></main><footer><div>STAGE 02 / 建筑与加载结构<br>开发模型预览 · 非游戏运行截图</div><div id="note">直接使用运行时的墙体、房间和区块描述。分区标签为编辑标注；内装、摄影式纹理与 Cycles 静态烘焙待后续阶段制作。</div></footer><script type="module">
import * as T from '/vendor/three.module.min.js';
import {ALPHA150,ALPHA_CHUNKS150,ALPHA_ZONES150,describeChunk150} from '/alpha150-plan.js';
import {appendBox150} from '/alpha150-world.js?v=150s2';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),colors={floor:'#727c6f',wall:'#c1c2ac',skirt:'#4c6758',gate:'#587c68',fixture:'#626b62',diffuser:'#e7dcb0'},all=ALPHA_CHUNKS150.flatMap(c=>describeChunk150(c.id).boxes);let mode='overview';
function render(){const W=canvas.clientWidth,H=canvas.clientHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#202c25';ctx.fillRect(0,0,W,H);const aspect=W/H;
 const cam=new T.OrthographicCamera(-190*aspect,190*aspect,190,-190,.1,1500);if(mode==='overview'){cam.position.set(370,440,530);cam.lookAt(150,0,130);}else{cam.left=-32*aspect;cam.right=32*aspect;cam.top=32;cam.bottom=-32;cam.position.set(-22,50,233);cam.lookAt(34,0,182);}cam.updateProjectionMatrix();cam.updateMatrixWorld();const vp=new T.Matrix4().multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse),project=p=>{const v=new T.Vector3(...p).applyMatrix4(vp);return[(v.x+1)*W/2,(1-v.y)*H/2,v.z];};
 const faces=[];for(const b of all){if(b.kind==='ceiling'||b.kind==='fixture'||b.kind==='diffuser')continue;if(mode==='west'&&(b.x>88||b.z<145||b.z>222))continue;const a={position:[],normal:[],uv:[]};appendBox150(a,b,b.kind==='wall'?.014:0);for(let i=0;i<a.position.length;i+=9){const v=[0,3,6].map(k=>project(a.position.slice(i+k,i+k+3)));if(v.every(p=>p[0]<0)||v.every(p=>p[0]>W)||v.every(p=>p[1]<0)||v.every(p=>p[1]>H))continue;const n=a.normal.slice(i,i+3),wp=a.position.slice(i,i+3);if(n[0]*(cam.position.x-wp[0])+n[1]*(cam.position.y-wp[1])+n[2]*(cam.position.z-wp[2])<=0)continue;const shade=.58+.42*Math.max(0,n[0]*-.4+n[1]*.8+n[2]*.45);let rgb=new T.Color(colors[b.kind]||'#b3baa5');rgb.multiplyScalar(shade);faces.push({floor:b.kind==='floor',v,z:v.reduce((s,p)=>s+p[2],0)/3,c:'#'+rgb.getHexString()});}}
 faces.sort((a,b)=>(Number(b.floor)-Number(a.floor))||b.z-a.z);for(const f of faces){ctx.fillStyle=f.c;ctx.beginPath();f.v.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}
 if(mode==='overview'){for(const zone of ALPHA_ZONES150){const p=project([zone.x+zone.w/2,3.6,zone.z+zone.d/2]);ctx.font='bold 13px system-ui';const tw=ctx.measureText(zone.name).width;ctx.fillStyle='#1f322cdd';ctx.fillRect(p[0]-tw/2-7,p[1]-12,tw+14,23);ctx.fillStyle='#f0e8ce';ctx.fillText(zone.name,p[0]-tw/2,p[1]+4);}const p=project([0,0,185]);ctx.fillStyle='#e6c78e';ctx.font='bold 16px system-ui';ctx.fillText('← 西门',p[0]-66,p[1]+3);}else{const p=project([4,.2,185]);ctx.strokeStyle='#ebc988';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p[0],p[1]);const q=project([46,.2,185]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.fillStyle='#e8d29b';ctx.font='15px system-ui';ctx.fillText('西入口 → 先驱区连接通道',q[0]-30,q[1]+24);}
 ctx.fillStyle='#adc1b0';ctx.font='12px monospace';ctx.fillText('ALPHA150 / '+mode.toUpperCase()+' / METRES',W-340,H-20);document.documentElement.dataset.previewReady='true';
}
for(const id of ['overview','west'])document.getElementById(id).onclick=()=>{mode=id;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.id===id));document.getElementById('view-title').textContent=id==='overview'?'300 × 260 m':'WEST / 入口通道';document.getElementById('detail').textContent=id==='overview'?'顶板隐藏以展示布局':'标线仅用于开发路径显示';render();};window.onresize=render;render();
</script></html>
